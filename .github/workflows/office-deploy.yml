name: Deploy to Production (office)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: qaztwin-ssap-zone-slicer-office-local-runner

    steps:
      - name: Preserve existing Blender archive
        run: |
          TEMP_DIR="${RUNNER_TEMP:-/tmp}"
          if [ -f blender.tar.gz ]; then
            echo "Preserving existing Blender archive to $TEMP_DIR..."
            mv blender.tar.gz "$TEMP_DIR/blender.tar.gz.backup"
          else
            echo "No existing Blender archive found."
          fi

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download and reassemble Blender archive
        run: |
          TEMP_DIR="${RUNNER_TEMP:-/tmp}"
          if [ -f "$TEMP_DIR/blender.tar.gz.backup" ]; then
            echo "Restoring preserved Blender archive from $TEMP_DIR..."
            mv "$TEMP_DIR/blender.tar.gz.backup" blender.tar.gz
          else
            echo "Blender archive not found, downloading..."
            curl -L -o blender.tar.gz.partaa https://github.com/Privatik3/qaztwin-ssap-zone-slicer/releases/download/v1.0-blender/blender.tar.gz.partaa
            curl -L -o blender.tar.gz.partab https://github.com/Privatik3/qaztwin-ssap-zone-slicer/releases/download/v1.0-blender/blender.tar.gz.partab
            curl -L -o blender.tar.gz.partac https://github.com/Privatik3/qaztwin-ssap-zone-slicer/releases/download/v1.0-blender/blender.tar.gz.partac
            curl -L -o blender.tar.gz.partad https://github.com/Privatik3/qaztwin-ssap-zone-slicer/releases/download/v1.0-blender/blender.tar.gz.partad
            cat blender.tar.gz.partaa blender.tar.gz.partab blender.tar.gz.partac blender.tar.gz.partad > blender.tar.gz
            rm blender.tar.gz.part*
          fi

      - name: Set dev environment variables
        run: |
          rm -f .env
          touch .env
          #-------------
          echo "COMPOSE_NETWORK_NAME=qaztwin-ssap-dev-net" >> .env
          echo "NODE_ENV=production" >> .env
          #-------------
          echo "PORT=4103" >> .env
          echo "BASE_DIR=/home/serhii/Public/models/models" >> .env
          echo "PROCESS_TIMEOUT_MS=300000" >> .env
          echo "LOCK_TIMEOUT_MS=600000" >> .env
      - name: Prepare network and host directories (dev)
        run: |
          docker network inspect qaztwin-ssap-dev-net >/dev/null 2>&1 || docker network create qaztwin-ssap-dev-net

      - name: Start services
        run: |
          docker compose --project-name qaztwin-ssap-dev up --build --force-recreate -d

      # Step 3: Wait until the app service is healthy
      - name: Wait for blender-3d-zone-slicer-api to be healthy
        run: |
          set -e
          echo "Waiting for 'blender-3d-zone-slicer-api' service to become healthy..."
          health=""
          for i in {1..60}; do
            cid=$(docker compose --project-name qaztwin-ssap-dev ps -q blender-api)
            if [ -z "$cid" ]; then
              echo "blender-3d-zone-slicer-api container not found yet; retrying..."
              sleep 5
              continue
            fi
            status=$(docker inspect -f '{{.State.Status}}' "$cid")
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$cid")
            echo "blender-3d-zone-slicer-api status=$status health=$health"
            if [ "$status" = "running" ] && [ "$health" = "healthy" ]; then
              echo "blender-3d-zone-slicer-api is healthy."
              break
            fi
            sleep 5
          done
          if [ "$health" != "healthy" ]; then
            echo "blender-3d-zone-slicer-api did not become healthy in time"
            docker compose --project-name qaztwin-ssap-dev ps
            exit 1
          fi

      - name: Show deployment info (Office)
        run: |
          echo "✅ Production (office) deployment completed!"
          echo "🌐 Service URL: http://localhost:${PORT}"
          echo "🔍 Health check: http://localhost:${PORT}/health"
          echo "📊 Container status:"
          docker compose --project-name qaztwin-ssap-dev ps
